[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-shock"
version = "0.1.0"
description = "Supply-chain exposure intelligence and shock scenario simulator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[tool.setuptools.packages.find]
include = ["app*", "domain*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
